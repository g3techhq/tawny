name: PR CI

on:
  pull_request:
    branches:
      - main

concurrency:
  group: pr-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Format, lint, check, and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          components: rustfmt, clippy

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install Node.js dependencies
        run: npm ci

      - name: Install Dioxus Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Show toolchain
        run: |
          rustc --version
          cargo --version
          node --version
          npm --version

      - name: Check formatting
        run: |
          cargo fmt --all -- --check
          npm run format:web:check

      - name: Check builds
        run: |
          cargo check
          cargo check --no-default-features --features server
          cargo check --no-default-features --features mobile
          cargo check --no-default-features --features desktop

      - name: Run linters
        run: |
          cargo clippy --all-targets --no-deps
          cargo clippy --all-targets --no-default-features --features server --no-deps
          npm run lint:web

      - name: Run unit tests
        run: |
          npm run test:unit
          cargo test
          cargo test --no-default-features --features server

      - name: Check whitespace
        run: git diff --check
