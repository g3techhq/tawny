[package]
name = "tawny"
version = "0.1.0"
authors = ["Matthew Weisfeld <matthewedwardweisfeld@gmail.com>"]
edition = "2024"
rust-version = "1.89.0"
description = "A local-first, cross-platform YouTube client built with Dioxus."
publish = false
repository = "https://github.com/g3techhq/tawny"

[dependencies]
dioxus = { version = "=0.7.9", features = ["router", "fullstack"] }
dioxus-fullstack = "=0.7.9"
dioxus-icons = "0.1.0"
g3-route-transitions = { version = "0.2.0", features = ["native-back"] }
g3-native-plugins = { version = "0.2.0", features = ["back-button", "clipboard", "media"] }
g3-ui = { version = "0.2.0", features = ["transitions"] }
manganis = "=0.7.9"
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.140"
surrealdb-types = { version = "=3.2.4" }
cfg-if = "1.0.0"

# Server-only
tokio = { version = "1.42.0", features = ["full"], optional = true }
axum = { version = "0.8.9", optional = true }
reqwest = { version = "0.12.23", default-features = false, features = ["json", "rustls-tls", "stream"], optional = true }
surrealdb = { version = "=3.2.4", features = ["kv-mem"], optional = true }
anyhow = { version = "1.0.98", optional = true }
dotenvy = { version = "0.15.7", optional = true }
quick-xml = { version = "0.37.5", optional = true }
rustypipe = { version = "0.11.4", default-features = false, features = ["rustls-tls-native-roots", "rss"], optional = true }
hmac = { version = "0.12.1", optional = true }
sha1 = { version = "0.10.6", optional = true }
hex = { version = "0.4.3", optional = true }
base64 = { version = "0.22.1", optional = true }
futures-util = { version = "0.3.31", optional = true }
rand = { version = "0.9.2", optional = true }
# Passwords are hashed with Argon2id. Session tokens are 256 bits straight
# from `rand` and only need a fast digest at rest, which is what sha2 is for.
argon2 = { version = "0.5", optional = true }
sha2 = { version = "0.10", optional = true }
time = { version = "0.3.55", features = ["parsing"] }
web-time = "1.1.0"

# The backend URL has to be known before `dioxus::launch`, because
# `set_server_url` writes a `OnceLock` and a second call is silently ignored.
# That rules out the localStorage helper in `cache`, which needs a running app
# to eval, so each client platform reads its own store directly instead.
web-sys = { version = "0.3", features = ["Window", "Storage"], optional = true }
dirs = { version = "6", optional = true }

[features]
# Keep the default target neutral.  Dioxus then builds the web client with the
# `web` feature and the Axum host with `server` when `dx serve --web` runs a
# full-stack app.  Defaulting to `web` made DX select the client-only `main`,
# so none of the server-function or custom Axum routes existed at runtime.
default = []
web = ["dioxus/web", "dep:web-sys"]
desktop = ["dioxus/desktop", "dep:dirs"]
mobile = ["dioxus/mobile", "tokio", "dep:dirs"]
server = [
    "dioxus/server",
    "tokio",
    "axum",
    "reqwest",
    "surrealdb",
    "anyhow",
    "dotenvy",
    "quick-xml",
    "rustypipe",
    "hmac",
    "sha1",
    "hex",
    "base64",
    "futures-util",
    "rand",
    "argon2",
    "sha2",
]

[profile.wasm-dev]
inherits = "dev"
opt-level = 1

[profile.server-dev]
inherits = "dev"

[profile.android-dev]
inherits = "dev"
debug = 0
strip = "debuginfo"

[target.wasm32-unknown-unknown.dependencies.getrandom_v03]
package = "getrandom"
version = "0.3.3"
features = ["wasm_js"]

[target.wasm32-unknown-unknown.dependencies.getrandom_v02]
package = "getrandom"
version = "0.2"
features = ["js"]
