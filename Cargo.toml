[package]
name = "tawny"
version = "0.1.0"
authors = ["Matthew Weisfeld <matthewedwardweisfeld@gmail.com>"]
edition = "2024"
rust-version = "1.89.0"
description = "A local-first, cross-platform YouTube client built with Dioxus."

[dependencies]
dioxus = { version = "=0.7.9", features = ["router", "fullstack"] }
dioxus-fullstack = "=0.7.9"
dioxus-icons = "0.1.0"
dx-route-transitions = "0.1.0"
g3-ui = { version = "0.1.0", features = ["transitions"] }
manganis = "=0.7.9"
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.140"
surrealdb-types = { version = "=3.0.5" }
cfg-if = "1.0.0"

# Server-only
tokio = { version = "1.42.0", features = ["full"], optional = true }
axum = { version = "0.8.9", optional = true }
reqwest = { version = "0.12.23", default-features = false, features = ["json", "rustls-tls", "stream"], optional = true }
surrealdb = { version = "=3.0.5", features = ["kv-mem", "kv-rocksdb"], optional = true }
anyhow = { version = "1.0.98", optional = true }
quick-xml = { version = "0.37.5", optional = true }
rustypipe = { version = "0.11.4", default-features = false, features = ["rustls-tls-native-roots", "rss"], optional = true }
hmac = { version = "0.12.1", optional = true }
sha1 = { version = "0.10.6", optional = true }
hex = { version = "0.4.3", optional = true }
base64 = { version = "0.22.1", optional = true }
futures-util = { version = "0.3.31", optional = true }
rand = { version = "0.9.2", optional = true }
time = { version = "0.3.55", features = ["parsing"] }
web-time = "1.1.0"

[features]
default = ["web"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile", "tokio"]
server = [
    "dioxus/server",
    "tokio",
    "axum",
    "reqwest",
    "surrealdb",
    "anyhow",
    "quick-xml",
    "rustypipe",
    "hmac",
    "sha1",
    "hex",
    "base64",
    "futures-util",
    "rand",
]

[profile.wasm-dev]
inherits = "dev"
opt-level = 1

[profile.server-dev]
inherits = "dev"

[profile.android-dev]
inherits = "dev"
debug = 0
strip = "debuginfo"

[target.wasm32-unknown-unknown.dependencies.getrandom_v03]
package = "getrandom"
version = "0.3.3"
features = ["wasm_js"]

[target.wasm32-unknown-unknown.dependencies.getrandom_v02]
package = "getrandom"
version = "0.2"
features = ["js"]
