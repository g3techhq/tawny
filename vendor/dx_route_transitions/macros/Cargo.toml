[package]
name = "dx-route-transitions-macros"
version = "0.1.0"
authors = ["Matthew Weisfeld <matthewedwardweisfeld@gmail.com>"]
edition = "2024"
description = "Proc macro support for dx-route-transitions."
readme = "README.md"
documentation = "https://docs.rs/dx-route-transitions-macros"
license = "MIT OR Apache-2.0"
keywords = ["dioxus", "router", "transitions", "macro"]
categories = ["development-tools::procedural-macro-helpers", "gui", "wasm"]
include = ["Cargo.toml", "README.md", "src/**"]

[lib]
name = "dx_route_transitions_macros"
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }