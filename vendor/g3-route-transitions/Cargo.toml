[package]
name = "g3-route-transitions"
version = "0.1.0"
authors = ["Matthew Weisfeld <matthewedwardweisfeld@gmail.com>"]
edition = "2024"
description = "Route-owned View Transition helpers for Dioxus Router."
readme = "README.md"
documentation = "https://docs.rs/g3-route-transitions"
license = "MIT OR Apache-2.0"
keywords = ["dioxus", "router", "transitions", "view-transitions"]
categories = ["gui", "wasm", "web-programming"]
include = ["Cargo.toml", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE", "src/**", "assets/**"]

[lib]
name = "g3_route_transitions"
path = "src/lib.rs"

[dependencies]
dioxus = { version = "0.7.9", features = ["router"] }
g3-route-transitions-macros = { version = "0.1.0", path = "macros" }
manganis = "0.7.9"
g3-native-plugins = { version = "0.1.0", path = "../g3-native-plugins", default-features = false, optional = true }

[features]
default = []
native-back = ["dep:g3-native-plugins", "g3-native-plugins/back-button"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3.102", features = ["Navigator", "Window"] }
