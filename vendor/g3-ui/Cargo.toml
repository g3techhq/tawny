[package]
name = "g3-ui"
version = "0.1.0"
authors = ["Matthew Weisfeld <matthewedwardweisfeld@gmail.com>"]
edition = "2024"
resolver = "2"
description = "Mobile-first Dioxus component library inspired by Ionic."
readme = "README.md"
documentation = "https://docs.rs/g3-ui"
license = "MIT OR Apache-2.0"
keywords = ["dioxus", "ui", "components", "mobile"]
categories = ["gui", "wasm", "web-programming"]
include = ["Cargo.toml", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE", "src/**", "assets/**"]

[lib]
name = "g3_ui"
path = "src/lib.rs"

[features]
playground = []
transitions = ["dep:g3-route-transitions"]

[dependencies]
dioxus = { version = "0.7.9", features = ["router"] }
dioxus-icons = "0.1.0"
dioxus-sdk-time = "0.7.0"
cfg-if = "1.0.0"
manganis = "0.7.9"
g3-route-transitions = { version = "0.1.0", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3.102", features = ["Document", "DomTokenList", "HtmlElement", "Navigator", "Window"] }